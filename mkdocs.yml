# MkDocs configuration for the PMS documentation site.
# Deployed to GitHub Pages by .github/workflows/docs.yml.
site_name: PMS — Portable Media Search
site_description: Local-first multimodal media search with EmbeddingGemma-2.
site_url: https://drbiobit.github.io/Project-PMS/
repo_url: https://github.com/drbiobit/Project-PMS
edit_uri: https://github.com/drbiobit/Project-PMS/edit/main/docs/
theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      toggle:
        color: rgba(255, 255, 255, 0.87)
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: indigo
      toggle:
        color: rgba(0, 0, 0, 0.7)
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search
nav:
  - Home: index.md
  - Installer: installer.md
  - Architecture: architecture.md
  - Deployment: deployment.md
  - Usage: usage.md
  - Files: files.md
markdown_extensions:
  - toc:
      toc_depth: 3
  - pymdownx.highlight
  - pymdownx.superfences
