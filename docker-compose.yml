# PMS — Portable Media Search · self-hosted deployment
#
#   1. Put your photos / videos / audio in the folder you point at below
#   2. docker compose up -d
#   3. open http://localhost:9090
#
# The first boot downloads nothing at runtime (model + llama-server are
# baked into the image) and builds the index over your media folder.
# The index lives in the pms-data volume, so later boots are fast
# (only new files get embedded).
#
# GPU images (faster indexing for big libraries):
#   NVIDIA:  image: ghcr.io/drbiobit/pms:cuda   (+ nvidia deploy block)
#   AMD:     image: ghcr.io/drbiobit/pms:rocm
#   CPU:     image: ghcr.io/drbiobit/pms:cpu    (default, works everywhere)

services:
  pms:
    image: ghcr.io/drbiobit/pms:cpu
    ports:
      - "9090:9090"
    volumes:
      - ./media:/media:ro      # ← your media folder goes here
      - pms-data:/data          # index database (persistent)
    environment:
      PMS_MEDIA_DIR: /media
      # PMS_PORT: "9090"
      # PMS_TOP_N: "100"
      # PMS_AUTH_USER: "admin"
      # PMS_AUTH_PASS: "pms"
    restart: unless-stopped
    # NVIDIA GPU — uncomment for the :cuda image:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  pms-data:
