name: Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU · x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=cpu
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: LLAMA_VARIANT=cpu-x64
          push: true
          metadata-file: ${{ steps.meta.outputs.path }}

  cpu-arm64:
    name: CPU · aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=cpu-arm64
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          build-args: LLAMA_VARIANT=cpu-arm64
          push: true
          metadata-file: ${{ steps.meta.outputs.path }}

  cuda:
    name: CUDA · NVIDIA GPU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=cuda
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: LLAMA_VARIANT=cuda-x64
          push: true
          metadata-file: ${{ steps.meta.outputs.path }}

  rocm:
    name: ROCm · AMD GPU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=rocm
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: LLAMA_VARIANT=rocm-x64
          push: true
          metadata-file: ${{ steps.meta.outputs.path }}
