# Builds the MkDocs documentation site and deploys it to GitHub Pages.
#
# One-time setup (in the repo Settings → Pages):
#   Source = "GitHub Actions". After that, every push to main that touches
#   docs/ or mkdocs.yml rebuilds and republishes the site at
#   https://drbiobit.github.io/Project-PMS/
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs
        run: pip install mkdocs mkdocs-material

      - name: Build the site
        run: mkdocs build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

      - id: deployment
        uses: actions/deploy-pages@v3
